<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Model Clock</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --edge: #262d37;
    --text: #e6edf3;
    --muted: #7d8998;
    --accent: #58a6ff;
    --morning: #f6c358;
    --working: #34d399;
    --evening: #fb923c;
    --asleep: #5f6b7c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #f6f8fa; --card: #ffffff; --edge: #d8dee4;
    --text: #1f2328; --muted: #656d76; --asleep: #8c96a3;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 40px; }

  header {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 10px 16px; margin-bottom: 6px;
  }
  h1 { font-size: 1.45rem; margin: 0; letter-spacing: -0.01em; }
  .utc { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .controls { margin: 14px 0 18px; display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: .85rem; cursor: pointer;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--edge); border-radius: 999px;
    padding: 6px 14px;
  }
  button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }

  .grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--edge);
    border-radius: 12px; padding: 12px 16px;
  }
  .bar { width: 5px; align-self: stretch; border-radius: 3px; flex: none; }
  .who { flex: 1 1 auto; min-width: 0; }
  .name {
    font-size: 1.05rem; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .chatter { font-size: .78rem; color: var(--muted); }
  .clock { text-align: right; flex: none; }
  .time {
    font-size: 1.3rem; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .secs { font-size: .8em; font-weight: 500; opacity: .55; }
  .day { font-size: .72rem; color: var(--muted); }
  .day.other { color: var(--accent); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    margin-top: 22px; color: var(--muted); font-size: .8rem;
  }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  footer { margin-top: 18px; color: var(--muted); font-size: .75rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🕐 Model Clock</h1>
    <div class="utc" id="utc"></div>
  </header>

  <div class="controls">
    <button id="sortBtn" aria-pressed="false">Sort by time</button>
    <button id="hideBtn" aria-pressed="false">Hide sleeping</button>
    <button id="themeBtn">Light / dark</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--morning)"></i>morning</span>
    <span><i class="dot" style="background:var(--working)"></i>day</span>
    <span><i class="dot" style="background:var(--evening)"></i>evening</span>
    <span><i class="dot" style="background:var(--asleep)"></i>night</span>
  </div>

  <footer>Updates live. Times come from your device clock, so they stay
  correct through daylight saving changes.</footer>
</div>

<script>
// ---- ROSTER. Edit here: [name, timezone, chatter] -------------------------
const MODELS = [
  ["Celestial",    "Europe/London",         "Sofhea"],
  ["Cassie",       "America/Chicago",       "Liberty"],
  ["Leia",         "America/Phoenix",       "Ella"],
  ["Izzy",         "America/Los_Angeles",   "Hannah"],
  ["Mia",          "America/Toronto",       "Kylie"],
  ["Brooke",       "America/Chicago",       "Bella"],
  ["Charlotte",    "America/New_York",      "Natalija"],
  ["Maddie",       "America/Los_Angeles",   "Caroline"],
  ["Olivia",       "America/Chicago",       "Leah"],
  ["Daisy",        "America/Chicago",       "Olivia"],
  ["Maya Clarke",  "America/Chicago",       "Natasha"],
  ["Scarlett",     "America/New_York",      "Morgan"],
  ["Lulu",         "America/New_York",      "Kaidyn"],
  ["Camilla",      "America/New_York",      "Valentina"],
  ["Gia",          "America/Chicago",       "Kiersten"],
  ["Emma",         "America/New_York",      "Ellie"],
  ["Iris",         "America/Los_Angeles",   "Summer"],
  ["Lea",          "America/Vancouver",     "Azalea"],
  ["Sienna",       "America/Toronto",       "Teegan"],
  ["Bella",        "America/Los_Angeles",   "Jordyn"],
  ["Zara",         "Europe/Stockholm",      "Angelina"],
  ["Katt",         "Europe/London",         "JulieAnn"],
];

const SLEEP_START = 23, SLEEP_END = 7, MORNING_END = 10, DAY_END = 18;
// --------------------------------------------------------------------------

let sortByTime = false, hideSleeping = false;

function partsFor(tz, now) {
  const f = new Intl.DateTimeFormat("en-GB", {
    timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit",
    weekday: "short", hour12: false,
  });
  const p = {};
  for (const { type, value } of f.formatToParts(now)) p[type] = value;
  if (p.hour === "24") p.hour = "00";
  return p;
}

function statusOf(hour) {
  if (hour >= SLEEP_START || hour < SLEEP_END) return "asleep";
  if (hour < MORNING_END) return "morning";
  if (hour < DAY_END) return "working";
  return "evening";
}

function offsetMinutes(tz, now) {
  const s = new Intl.DateTimeFormat("en-GB", {
    timeZone: tz, timeZoneName: "longOffset",
  }).formatToParts(now).find(p => p.type === "timeZoneName").value;
  const m = s.match(/GMT([+-])(\d{2}):(\d{2})/);
  if (!m) return 0;
  return (m[1] === "-" ? -1 : 1) * (+m[2] * 60 + +m[3]);
}

const grid = document.getElementById("grid");
const nodes = new Map();

function build() {
  grid.innerHTML = "";
  nodes.clear();
  for (const [name, tz, chatter] of MODELS) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<i class="bar"></i>' +
      '<div class="who"><div class="name"></div>' +
      '<div class="chatter"></div></div>' +
      '<div class="clock"><div class="time"></div>' +
      '<div class="day"></div></div>';
    row.querySelector(".name").textContent = name;
    row.querySelector(".chatter").textContent = chatter ? "→ " + chatter : "";
    grid.appendChild(row);
    nodes.set(name, row);
  }
}

function tick() {
  const now = new Date();
  const utc = new Intl.DateTimeFormat("en-GB", {
    timeZone: "UTC", hour: "2-digit", minute: "2-digit",
    second: "2-digit", hour12: false,
  }).format(now);
  document.getElementById("utc").textContent = utc + " UTC";

  const todayUTC = new Intl.DateTimeFormat("en-GB",
    { timeZone: "UTC", weekday: "short" }).format(now);

  const entries = MODELS.map(([name, tz, chatter]) => {
    const p = partsFor(tz, now);
    const hour = parseInt(p.hour, 10);
    return { name, tz, chatter, p, hour, status: statusOf(hour),
             offset: offsetMinutes(tz, now) };
  });

  if (sortByTime) entries.sort((a, b) => a.offset - b.offset);

  for (const e of entries) {
    const row = nodes.get(e.name);
    if (!row) continue;

    const colour = `var(--${e.status})`;
    row.querySelector(".bar").style.background = colour;

    const t = row.querySelector(".time");
    t.innerHTML = `${e.p.hour}:${e.p.minute}<span class="secs">:${e.p.second}</span>`;
    t.style.color = colour;

    const d = row.querySelector(".day");
    const differs = e.p.weekday !== todayUTC;
    d.textContent = e.p.weekday;
    d.className = "day" + (differs ? " other" : "");

    row.style.display = (hideSleeping && e.status === "asleep") ? "none" : "";
    if (sortByTime) grid.appendChild(row);
  }
}

document.getElementById("sortBtn").onclick = e => {
  sortByTime = !sortByTime;
  e.target.setAttribute("aria-pressed", sortByTime);
  e.target.textContent = sortByTime ? "Roster order" : "Sort by time";
  if (!sortByTime) build();
  tick();
};

document.getElementById("hideBtn").onclick = e => {
  hideSleeping = !hideSleeping;
  e.target.setAttribute("aria-pressed", hideSleeping);
  tick();
};

document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
};

build();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
